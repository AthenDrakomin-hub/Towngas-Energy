<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>港华智慧能源 - 在线客服</title>
<style>
:root{
  --primary:#0099d6;
  --primary-dark:#007bb5;
  --primary-light:#e6f5fc;
  --bg:#f5f8fa;
  --text:#1a1a1a;
  --text-secondary:#8a8a8a;
  --border:#e8ecee;
  --danger:#ff3b30;
  --success:#34c759;
  --warning:#ff9500;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);overflow:hidden;font-size:15px}

/* ===== 登录遮罩 ===== */
.login-mask{
  position:fixed;inset:0;z-index:100;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.login-mask.hidden{display:none}
.login-box{
  background:#fff;border-radius:16px;padding:28px 24px;
  width:100%;max-width:340px;
  box-shadow:0 8px 32px rgba(0,0,0,.15);
}
.login-box h2{font-size:18px;color:var(--text);margin-bottom:4px;text-align:center}
.login-box .sub-title{font-size:12px;color:var(--text-secondary);text-align:center;margin-bottom:20px}
.login-box label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px}
.login-box input{
  width:100%;border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;font-size:14px;margin-bottom:14px;outline:none;
}
.login-box input:focus{border-color:var(--primary)}
.login-box button{
  width:100%;background:var(--primary);color:#fff;border:none;
  border-radius:10px;padding:12px;font-size:15px;font-weight:500;cursor:pointer;
}
.login-box button:disabled{opacity:.5;cursor:not-allowed}
.login-error{color:var(--danger);font-size:12px;text-align:center;margin-top:10px;min-height:16px}

/* ===== 顶部品牌栏 ===== */
.header{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;
  position:fixed;top:0;left:0;right:0;z-index:10;color:#fff;
  box-shadow:0 2px 12px rgba(0,153,214,.25);
}
.header .logo{
  width:40px;height:40px;border-radius:50%;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.header .logo::before{
  content:"";
  width:18px;height:22px;
  background:linear-gradient(to top,var(--primary),#4dd0e1);
  clip-path:polygon(50% 0%, 100% 30%, 100% 70%, 50% 100%, 0% 70%, 0% 30%);
}
.header .info{flex:1;min-width:0}
.header .name{font-size:16px;font-weight:600;line-height:1.3}
.header .sub{font-size:11px;color:rgba(255,255,255,.85);margin-top:2px}
.header .status{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:11px}
.header .status-dot{width:6px;height:6px;border-radius:50%}
.header .status-dot.online{background:var(--success);box-shadow:0 0 4px var(--success);animation:pulse 2s infinite}
.header .status-dot.connecting{background:var(--warning);box-shadow:0 0 4px var(--warning);animation:pulse 1s infinite}
.header .status-dot.offline{background:var(--danger);box-shadow:0 0 4px var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ===== 聊天区域 ===== */
.chat-area{
  position:fixed;top:72px;bottom:56px;left:0;right:0;
  overflow-y:auto;padding:16px 12px;
  -webkit-overflow-scrolling:touch;
}
.msg{display:flex;margin-bottom:14px;align-items:flex-start;gap:8px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.left{justify-content:flex-start}
.msg.right{justify-content:flex-end;flex-direction:row-reverse}
.msg .avatar{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;flex-shrink:0;
}
.msg.left .avatar{background:var(--primary);color:#fff}
.msg.right .avatar{background:#e8e8ed;color:var(--text-secondary)}
.msg .bubble{
  max-width:72%;padding:10px 14px;
  border-radius:16px;line-height:1.5;word-break:break-word;
  font-size:14.5px;
}
.msg.left .bubble{
  background:#fff;color:var(--text);
  border-top-left-radius:4px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.msg.right .bubble{
  background:var(--primary);color:#fff;
  border-top-right-radius:4px;
}

/* typing 指示器 */
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text-secondary);animation:typingBounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* ===== 快捷问题按钮 ===== */
.quick-questions{
  display:flex;flex-wrap:wrap;gap:8px;
  margin-top:8px;
}
.quick-q{
  background:rgba(255,255,255,.9);
  color:var(--primary);
  border:1px solid rgba(0,153,214,.3);
  border-radius:20px;padding:7px 14px;
  font-size:13px;cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.quick-q:active{background:var(--primary);color:#fff;transform:scale(.97)}
.quick-q.disabled{opacity:.5;pointer-events:none}

/* ===== 底部输入栏 ===== */
.input-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;padding:8px 12px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;
  border-top:1px solid var(--border);
}
.input-bar input{
  flex:1;border:1px solid var(--border);
  border-radius:22px;padding:9px 16px;
  font-size:15px;outline:none;background:var(--bg);
}
.input-bar input:focus{border-color:var(--primary);background:#fff}
.input-bar input:disabled{opacity:.5}
.input-bar button{
  background:var(--primary);color:#fff;border:none;
  border-radius:22px;padding:9px 18px;
  font-size:14px;font-weight:500;cursor:pointer;
}
.input-bar button:disabled{opacity:.5;cursor:not-allowed}

.loading{text-align:center;color:var(--text-secondary);font-size:13px;padding:24px}

/* toast 提示 */
.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;
  border-radius:8px;font-size:13px;z-index:200;
  opacity:0;transition:opacity .2s;pointer-events:none;
  max-width:80%;text-align:center;
}
.toast.show{opacity:1}
</style>
</head>

/* ==================== 工具函数 ==================== */

/** XSS 转义 */
function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/** 轻量 toast 提示 */
function toast(msg, duration) {
  duration = duration || 2000;
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(function () { el.classList.remove('show'); }, duration);
}

/** 读取 URL query 参数 */
function getUrlParams() {
  var params = {};
  var search = window.location.search.substring(1);
  if (!search) return params;
  var pairs = search.split('&');
  for (var i = 0; i < pairs.length; i++) {
    var idx = pairs[i].indexOf('=');
    if (idx > 0) {
      params[decodeURIComponent(pairs[i].substring(0, idx))] = decodeURIComponent(pairs[i].substring(idx + 1));
    }
  }
  return params;
}

/* ==================== 本地存储（账号/设备/消息） ==================== */

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      devId: devId,
      userName: document.getElementById('loginUser').value
    }));
  } catch (e) { /* 隐私模式等场景静默降级 */ }
}

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveMessages(messages) {
  try {
    var trimmed = messages.slice(-MAX_HISTORY);
    localStorage.setItem(MSG_STORAGE_KEY, JSON.stringify(trimmed));
  } catch (e) {}
}

function loadMessages() {
  try {
    var raw = localStorage.getItem(MSG_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}

function appendMessage(direction, text) {
  var messages = loadMessages();
  messages.push({ direction: direction, text: text, time: Date.now() });
  saveMessages(messages);
}

/* ==================== 连接状态 UI 绑定（修复P2-6） ==================== */

function setConnectionState(state) {
  wsState = state;
  var dot = document.getElementById('statusDot');
  var text = document.getElementById('statusText');
  dot.className = 'status-dot';
  switch (state) {
    case 'connected':
      dot.classList.add('online');
      text.textContent = '在线为您服务';
      break;
    case 'connecting':
      dot.classList.add('connecting');
      text.textContent = '连接中...';
      break;
    case 'reconnecting':
      dot.classList.add('connecting');
      text.textContent = '重新连接中...';
      break;
    case 'disconnected':
    default:
      dot.classList.add('offline');
      text.textContent = '已离线';
      break;
  }
}

/* ==================== 登录模块（修复P0-1：移除硬编码凭证） ==================== */

async function doLogin() {
  var userInput = document.getElementById('loginUser');
  var passInput = document.getElementById('loginPass');
  var btn = document.getElementById('loginBtn');
  var errorEl = document.getElementById('loginError');

  var userName = userInput.value.trim();
  var password = passInput.value;

  // 参数校验
  if (!userName) { errorEl.textContent = '请输入账号'; return; }
  if (!password) { errorEl.textContent = '请输入密码'; return; }

  btn.disabled = true;
  btn.textContent = '登录中...';
  errorEl.textContent = '';

  try {
    var res = await fetch(API_BASE + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userName: userName, password: password, terminal: 0 })
    });
    var data = await res.json();

    if (data.code !== 200 || !data.data || !data.data.accessToken) {
      throw new Error(data.msg || '登录失败');
    }

    accessToken = data.data.accessToken;

    // 修复P0-2：从登录响应动态获取用户ID，兼容多种字段命名
    myId = data.data.userId || data.data.id || data.data.uid || null;
    if (!myId) {
      console.warn('[客服] 登录响应未包含用户ID字段，消息发送可能异常。响应字段：', Object.keys(data.data));
    }

    saveState();

    // 进入聊天界面
    document.getElementById('loginMask').classList.add('hidden');
    document.getElementById('loading').style.display = 'none';
    document.getElementById('msgInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;

    initChat();
  } catch (e) {
    errorEl.textContent = e.message || '登录失败，请重试';
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

/* ==================== WebSocket 模块（修复P1-5：指数退避重连） ==================== */

function connectWS() {
  if (!accessToken) {
    console.warn('[客服] 无 accessToken，跳过 WS 连接');
    return;
  }
  // 已有连接或正在连接则跳过
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
    return;
  }

  setConnectionState(reconnectAttempts > 0 ? 'reconnecting' : 'connecting');

  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    console.error('[客服] WebSocket 创建失败', e);
    scheduleReconnect();
    return;
  }

  ws.binaryType = 'arraybuffer';

  ws.onopen = function () {
    reconnectAttempts = 0;
    setConnectionState('connected');

    // 发送鉴权包
    try {
      ws.send(JSON.stringify({ cmd: 0, data: { accessToken: accessToken, devId: devId } }));
    } catch (e) {
      console.error('[客服] 发送鉴权包失败', e);
    }

    // 启动心跳
    clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(function () {
      if (ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.send(JSON.stringify({ cmd: 1, data: {} }));
        } catch (e) {
          console.error('[客服] 心跳发送失败', e);
        }
      }
    }, HEARTBEAT_INTERVAL);

    // 拉取离线消息（断线期间客服发来的消息）
    loadOfflineMessages();
  };

  ws.onmessage = function (e) {
    try {
      var msg = JSON.parse(e.data);
      if (msg && msg.data && msg.data.messageBody) {
        var body = msg.data.messageBody;
        // 只渲染非本人的文本消息；myId 为空时无法判断归属，跳过
        if (myId !== null && body.sendId !== myId && body.type === 0) {
          var content = body.content || '';
          if (content) {
            hideTyping();
            addMsg('left', content, true);
          }
        }
      }
    } catch (err) {
      // 修复P2-8：解析失败不再静默，提示用户
      console.error('[客服] WS 消息解析失败', err, e.data);
      toast('收到异常消息，已忽略');
    }
  };

  ws.onerror = function (e) {
    console.error('[客服] WebSocket 错误', e);
  };

  ws.onclose = function () {
    clearInterval(heartbeatTimer);
    if (shouldReconnect) {
      scheduleReconnect();
    } else {
      setConnectionState('disconnected');
    }
  };
}

/** 指数退避重连调度：1s→2s→4s→8s→16s→30s，最大10次 */
function scheduleReconnect() {
  if (!shouldReconnect) return;

  if (reconnectAttempts >= RECONNECT_MAX_ATTEMPTS) {
    setConnectionState('disconnected');
    toast('连接失败，请刷新页面重试', 4000);
    return;
  }

  reconnectAttempts++;
  var delay = Math.min(
    RECONNECT_BASE_DELAY * Math.pow(2, reconnectAttempts - 1),
    RECONNECT_MAX_DELAY
  );

  setConnectionState('reconnecting');
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(function () {
    connectWS();
  }, delay);
}

function disconnectWS() {
  shouldReconnect = false;
  clearTimeout(reconnectTimer);
  clearInterval(heartbeatTimer);
  if (ws) {
    ws.onclose = null;
    try { ws.close(); } catch (e) {}
    ws = null;
  }
  setConnectionState('disconnected');
}

/* ==================== 消息渲染（修复P1-4：历史持久化） ==================== */

function addMsg(direction, text, persist) {
  if (persist !== false) {
    appendMessage(direction, text);
  }
  var chatArea = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg ' + direction;
  var avatar = direction === 'left' ? '港' : '我';
  div.innerHTML = '<div class="avatar">' + avatar + '</div><div class="bubble">' + escapeHtml(text) + '</div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

/** 显示"正在输入"动画 */
function showTyping() {
  hideTyping();
  var chatArea = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg left';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="avatar">港</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;

  // 超时自动隐藏
  clearTimeout(typingTimer);
  typingTimer = setTimeout(hideTyping, TYPING_TIMEOUT);
}

function hideTyping() {
  clearTimeout(typingTimer);
  var el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

/** 从 localStorage 恢复历史消息 */
function loadHistory() {
  var messages = loadMessages();
  if (messages.length === 0) return false;

  var chatArea = document.getElementById('chatArea');
  var loading = document.getElementById('loading');
  if (loading) loading.style.display = 'none';

  for (var i = 0; i < messages.length; i++) {
    var m = messages[i];
    var div = document.createElement('div');
    div.className = 'msg ' + m.direction;
    var avatar = m.direction === 'left' ? '港' : '我';
    div.innerHTML = '<div class="avatar">' + avatar + '</div><div class="bubble">' + escapeHtml(m.text) + '</div>';
    chatArea.appendChild(div);
  }
  chatArea.scrollTop = chatArea.scrollHeight;
  return true;
}

/* ==================== 快捷问题（修复P2-7：点击反馈） ==================== */

function showQuickQuestions() {
  if (quickQuestionsShown) return;
  quickQuestionsShown = true;

  var chatArea = document.getElementById('chatArea');
  var div = document.createElement('div');
  div.className = 'msg left';
  div.id = 'quickQuestionsBox';

  var html = '<div class="avatar">港</div><div class="bubble"><div class="quick-questions">';
  for (var i = 0; i < QUICK_QUESTIONS.length; i++) {
    html += '<div class="quick-q" data-index="' + i + '">' + QUICK_QUESTIONS[i] + '</div>';
  }
  html += '</div></div>';
  div.innerHTML = html;

  chatArea.appendChild(div);

  // 使用事件委托绑定点击
  var buttons = div.querySelectorAll('.quick-q');
  for (var j = 0; j < buttons.length; j++) {
    buttons[j].addEventListener('click', function () {
      handleQuick(parseInt(this.getAttribute('data-index'), 10));
    });
  }

  chatArea.scrollTop = chatArea.scrollHeight;
}

function handleQuick(index) {
  if (index < 0 || index >= QUICK_QUESTIONS.length) return;

  var q = QUICK_QUESTIONS[index];
  var text = q.replace(/^[^\u4e00-\u9fa5a-zA-Z]+/, '');

  // 禁用所有快捷按钮，防止重复点击
  var box = document.getElementById('quickQuestionsBox');
  if (box) {
    var btns = box.querySelectorAll('.quick-q');
    for (var i = 0; i < btns.length; i++) btns[i].classList.add('disabled');
  }

  addMsg('right', text);
  showTyping();

  setTimeout(function () {
    hideTyping();
    var reply = getAutoReply(text);
    if (reply) {
      addMsg('left', reply);
    } else {
      // 未匹配自动回复，走 WS 转人工
      var sent = sendViaWS(text);
      addMsg('left', sent ? '正在为您转接人工客服，请稍候...' : '当前网络异常，请稍后重试。');
      if (sent) showTyping();
    }
    // 恢复按钮
    if (box) {
      var restored = box.querySelectorAll('.quick-q');
      for (var j = 0; j < restored.length; j++) restored[j].classList.remove('disabled');
    }
  }, 600);
}

/* ==================== 自动回复匹配 ==================== */

function getAutoReply(text) {
  if (!text) return null;
  var lower = text.toLowerCase();
  for (var i = 0; i < AUTO_REPLIES.length; i++) {
    var item = AUTO_REPLIES[i];
    for (var j = 0; j < item.keywords.length; j++) {
      if (lower.indexOf(item.keywords[j].toLowerCase()) !== -1) {
        return item.reply;
      }
    }
  }
  return null;
}

/* ==================== 离线消息拉取（后端接口已就绪） ==================== */

/**
 * 调用后端 GET /message/private/loadOfflineMessage?minId=0
 * 拉取断线期间的离线消息，过滤客服(KEFU_ID)发来的文本消息并渲染
 */
async function loadOfflineMessages() {
  if (!accessToken) return;
  try {
    var res = await fetch(API_BASE + '/message/private/loadOfflineMessage?minId=0', {
      method: 'GET',
      headers: { 'accessToken': accessToken }
    });
    var data = await res.json();
    if (data.code !== 200 || !data.data || !Array.isArray(data.data)) {
      return;
    }
    var messages = data.data;
    for (var i = 0; i < messages.length; i++) {
      var msg = messages[i];
      // 只渲染客服发来的文本消息：sendId=KEFU_ID 且 type=0
      if (msg.sendId === KEFU_ID && msg.type === 0 && msg.content) {
        addMsg('left', msg.content, true);
      }
    }
  } catch (e) {
    console.error('[客服] 拉取离线消息失败', e);
  }
}

/* ==================== 消息发送（修复P1-3/P3-10：双通道互斥） ==================== */

/** 通过 WS 发送消息，返回是否发送成功 */
function sendViaWS(text) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    return false;
  }
  if (!myId) {
    console.warn('[客服] myId 为空，无法发送消息');
    toast('用户信息异常，请重新登录');
    return false;
  }
  try {
    ws.send(JSON.stringify({
      cmd: 2,
      data: {
        messageId: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        sendId: myId,
        receiveId: KEFU_ID,
        type: 0,
        content: text,
        sendTime: Date.now()
      }
    }));
    return true;
  } catch (e) {
    console.error('[客服] WS 消息发送失败', e);
    return false;
  }
}

function sendMsg() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text) return;

  addMsg('right', text);
  input.value = '';

  var reply = getAutoReply(text);
  if (reply) {
    // 修复P1-3：匹配到自动回复 → 仅本地应答，不发WS，避免人工客服重复回复
    showTyping();
    setTimeout(function () {
      hideTyping();
      addMsg('left', reply);
    }, 400);
  } else {
    // 未匹配 → 走 WS 发送给人工客服
    var sent = sendViaWS(text);
    if (sent) {
      showTyping();
    } else {
      // WS 不可用降级提示
      showTyping();
      setTimeout(function () {
        hideTyping();
        addMsg('left', '当前网络异常，消息可能未送达，请检查网络后重试。');
      }, 400);
    }
  }
}

/* ==================== 初始化 ==================== */

function initChat() {
  // 恢复历史消息
  var hasHistory = loadHistory();

  // 建立 WS 连接
  connectWS();

  // 欢迎语与快捷问题
  setTimeout(function () {
    if (!hasHistory) {
      addMsg('left', '您好，欢迎咨询港华智慧能源！请问有什么可以帮您？', false);
    }
    showQuickQuestions();
  }, 300);
}

function init() {
  // 修复P3-9：devId 持久化，首次生成后固定
  var state = loadState();
  if (state && state.devId) {
    devId = state.devId;
  } else {
    devId = 'web_visitor_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
  }

  // 支持 URL 参数自动登录：?user=xxx&pwd=xxx
  var params = getUrlParams();
  if (params.user && params.pwd) {
    document.getElementById('loginUser').value = params.user;
    document.getElementById('loginPass').value = params.pwd;
    doLogin();
    return;
  }

  // 从缓存恢复账号（不恢复密码）
  if (state && state.userName) {
    document.getElementById('loginUser').value = state.userName;
  }

  setConnectionState('disconnected');
}

/* ==================== 事件绑定 ==================== */

// 登录表单回车支持
document.getElementById('loginUser').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') document.getElementById('loginPass').focus();
});
document.getElementById('loginPass').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') doLogin();
});

// 聊天输入回车发送
document.getElementById('msgInput').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') sendMsg();
});

// 页面关闭时清理连接
window.addEventListener('beforeunload', function () {
  disconnectWS();
});

init();
</script>
