<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>港华智慧能源 - 客服工作台</title>
<style>
:root{
  --primary:#1a73e8;--primary-light:#e8f0fe;--bg:#f5f6f8;--panel:#fff;
  --border:#e4e6eb;--text:#1a1a2e;--text-secondary:#6b7280;--text-muted:#9ca3af;
  --online:#22c55e;--offline:#9ca3af;--unread:#ef4444;--hover:#f3f4f6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px}
.app{display:flex;height:100vh}

/* ===== 左侧会话列表 ===== */
.sidebar{width:280px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);background:var(--primary);color:#fff}
.agent-info{display:flex;align-items:center;gap:10px}
.agent-avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px}
.agent-name{font-weight:600;font-size:15px}
.agent-status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:4px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--online);display:inline-block}
.search-box{padding:10px 12px;border-bottom:1px solid var(--border)}
.search-box input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--bg)}
.search-box input:focus{border-color:var(--primary)}
.session-list{flex:1;overflow-y:auto}
.session-item{padding:12px 14px;display:flex;gap:10px;cursor:pointer;border-bottom:1px solid #f3f4f6;transition:background .15s;position:relative}
.session-item:hover{background:var(--hover)}
.session-item.active{background:var(--primary-light)}
.session-avatar{width:42px;height:42px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex-shrink:0;position:relative}
.session-avatar .online-indicator{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel)}
.session-avatar .online-indicator.online{background:var(--online)}
.session-avatar .online-indicator.offline{background:var(--offline)}
.session-content{flex:1;min-width:0}
.session-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.session-nick{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-time{font-size:11px;color:var(--text-muted);flex-shrink:0;margin-left:8px}
.session-preview{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-unread{position:absolute;top:10px;right:12px;min-width:18px;height:18px;border-radius:9px;background:var(--unread);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}
.empty-sessions{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13px}

/* ===== 中间聊天区 ===== */
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.chat-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--panel)}
.chat-visitor{display:flex;align-items:center;gap:10px}
.chat-visitor-avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:600}
.chat-visitor-name{font-weight:600;font-size:15px}
.chat-visitor-status{font-size:12px;color:var(--text-secondary)}
.chat-actions{display:flex;gap:8px}
.chat-actions button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:13px;color:var(--text-secondary);transition:all .15s}
.chat-actions button:hover{border-color:var(--primary);color:var(--primary)}
.messages{flex:1;overflow-y:auto;padding:20px;background:var(--bg)}
.msg{display:flex;margin-bottom:16px;max-width:75%}
.msg.left{align-self:flex-start}
.msg.right{align-self:flex-end;margin-left:auto;flex-direction:row-reverse}
.msg-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;margin:0 8px}
.msg.left .msg-avatar{background:var(--primary);color:#fff}
.msg.right .msg-avatar{background:#e8e8ed;color:var(--text-secondary)}
.msg-bubble{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;word-break:break-word;position:relative}
.msg.left .msg-bubble{background:#fff;border:1px solid var(--border);border-top-left-radius:4px}
.msg.right .msg-bubble{background:var(--primary);color:#fff;border-top-right-radius:4px}
.msg-time{font-size:11px;color:var(--text-muted);margin-top:4px;text-align:center}
.msg.left .msg-time{text-align:left}
.msg.right .msg-time{text-align:right}
.chat-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted)}
.chat-empty-icon{font-size:48px;margin-bottom:12px;opacity:.3}
.chat-empty-text{font-size:14px}

/* ===== 输入区 ===== */
.input-area{border-top:1px solid var(--border);padding:12px 20px;background:var(--panel)}
.quick-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.quick-tag{padding:4px 10px;border:1px solid var(--border);border-radius:14px;font-size:12px;cursor:pointer;color:var(--text-secondary);background:#fff;transition:all .15s}
.quick-tag:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.input-row{display:flex;gap:10px;align-items:flex-end}
.input-row textarea{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;resize:none;outline:none;font-family:inherit;min-height:44px;max-height:120px;line-height:1.5}
.input-row textarea:focus{border-color:var(--primary)}
.send-btn{padding:10px 24px;background:var(--primary);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;transition:opacity .15s;white-space:nowrap}
.send-btn:hover{opacity:.9}
.send-btn:disabled{opacity:.5;cursor:not-allowed}

/* ===== 右侧快捷回复面板 ===== */
.reply-panel{width:260px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.reply-panel.collapsed{width:0;overflow:hidden;border-left:none}
.reply-header{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.reply-close{cursor:pointer;color:var(--text-muted);font-size:18px;line-height:1}
.reply-cats{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.reply-cat{padding:4px 10px;border-radius:12px;font-size:12px;cursor:pointer;color:var(--text-secondary);background:var(--bg);transition:all .15s;white-space:nowrap}
.reply-cat.active{background:var(--primary);color:#fff}
.reply-list{flex:1;overflow-y:auto;padding:8px}
.reply-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;font-size:13px;color:var(--text);line-height:1.4;transition:background .15s;border:1px solid transparent}
.reply-item:hover{background:var(--primary-light);border-color:var(--primary)}
.reply-item .reply-id{font-size:10px;color:var(--text-muted);margin-bottom:2px}

/* ===== 登录遮罩 ===== */
.login-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100}
.login-box{background:#fff;padding:32px;border-radius:12px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.login-box h2{text-align:center;margin-bottom:24px;color:var(--primary)}
.login-box input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:14px;font-size:14px;outline:none}
.login-box input:focus{border-color:var(--primary)}
.login-box button{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:500}
.login-error{color:var(--unread);font-size:13px;text-align:center;margin-bottom:12px;min-height:18px}

/* ===== 连接状态条 ===== */
.conn-bar{position:fixed;bottom:0;left:0;right:0;padding:6px 20px;font-size:12px;text-align:center;z-index:50;display:none}
.conn-bar.show{display:block}
.conn-bar.connecting{background:#fef3c7;color:#92400e}
.conn-bar.online{background:#d1fae5;color:#065f46}
.conn-bar.offline{background:#fee2e2;color:#991b1b}

/* ===== 滚动条 ===== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 折叠按钮 ===== */
.toggle-reply{position:fixed;right:0;top:50%;transform:translateY(-50%);background:var(--primary);color:#fff;padding:8px 4px;border-radius:4px 0 0 4px;cursor:pointer;font-size:12px;z-index:10;writing-mode:vertical-rl}
</style>
</head>
<body>

<div class="app">
  <!-- 左侧会话列表 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="agent-info">
        <div class="agent-avatar" id="agentAvatar">客</div>
        <div>
          <div class="agent-name" id="agentName">客服工作台</div>
          <div class="agent-status"><span class="status-dot" id="statusDot"></span><span id="statusText">在线</span></div>
        </div>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索访客..." oninput="filterSessions()">
    </div>
    <div class="session-list" id="sessionList">
      <div class="empty-sessions">加载中...</div>
    </div>
  </div>

  <!-- 中间聊天区 -->
  <div class="chat-area">
    <div class="chat-header" id="chatHeader" style="display:none">
      <div class="chat-visitor">
        <div class="chat-visitor-avatar" id="chatAvatar">访</div>
        <div>
          <div class="chat-visitor-name" id="chatName">选择访客</div>
          <div class="chat-visitor-status" id="chatStatus">--</div>
        </div>
      </div>
      <div class="chat-actions">
        <button onclick="toggleReplyPanel()">快捷回复</button>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="chat-empty">
        <div class="chat-empty-icon">💬</div>
        <div class="chat-empty-text">从左侧选择一个访客开始对话</div>
      </div>
    </div>
    <div class="input-area" id="inputArea" style="display:none">
      <div class="quick-bar" id="quickBar"></div>
      <div class="input-row">
        <textarea id="msgInput" placeholder="输入消息，Enter发送，Shift+Enter换行" onkeydown="handleKeydown(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <!-- 右侧快捷回复面板 -->
  <div class="reply-panel" id="replyPanel">
    <div class="reply-header">
      <span>快捷回复</span>
      <span class="reply-close" onclick="toggleReplyPanel()">×</span>
    </div>
    <div class="reply-cats" id="replyCats"></div>
    <div class="reply-list" id="replyList"></div>
  </div>
</div>

<!-- 登录遮罩 -->
<div class="login-mask" id="loginMask" style="display:none">
  <div class="login-box">
    <h2>客服登录</h2>
    <div class="login-error" id="loginError"></div>
    <input type="text" id="loginUser" placeholder="客服账号">
    <input type="password" id="loginPass" placeholder="密码">
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- 连接状态条 -->
<div class="conn-bar" id="connBar"></div>

<!-- 客服账号配置（独立文件，不提交git） -->

/* ==================== 快捷问题（输入框上方） ==================== */
var QUICK_QUESTIONS = ['如何充值','如何提现','实名认证','修改密码','联系人工','营业时间'];

/* ==================== 初始化 ==================== */
window.onload = function() {
  initQuickBar();
  initReplyPanel();
  // 尝试从缓存恢复token
  var cachedToken = localStorage.getItem('kefu_agent_token');
  var cachedRefresh = localStorage.getItem('kefu_agent_refresh');
  var cachedExpire = localStorage.getItem('kefu_agent_expire');
  var cachedId = localStorage.getItem('kefu_agent_id');
  var cachedName = localStorage.getItem('kefu_agent_name');
  if (cachedToken && cachedRefresh && cachedExpire && Date.now() < parseInt(cachedExpire)) {
    accessToken = cachedToken;
    refreshToken = cachedRefresh;
    tokenExpireTime = parseInt(cachedExpire);
    myId = cachedId ? parseInt(cachedId) : null;
    myName = cachedName || '客服';
    startTokenRefresh();
    afterLogin();
  } else if (window.AGENT_CONFIG && AGENT_CONFIG.username && AGENT_CONFIG.password) {
    // 从config-agent.js自动登录
    autoLogin(AGENT_CONFIG.username, AGENT_CONFIG.password);
  } else {
    showLogin();
  }
};

/* ==================== 登录 ==================== */
function showLogin() {
  document.getElementById('loginMask').style.display = 'flex';
}

function hideLogin() {
  document.getElementById('loginMask').style.display = 'none';
}

async function autoLogin(user, pass) {
  document.getElementById('loginError').textContent = '正在自动登录...';
  showLogin();
  try {
    var res = await fetch(API_BASE + '/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({userName: user, password: pass})
    });
    var data = await res.json();
    if (data.code !== 200) {
      document.getElementById('loginError').textContent = data.msg || '登录失败';
      return;
    }
    saveLoginInfo(data.data);
    hideLogin();
    afterLogin();
  } catch (e) {
    document.getElementById('loginError').textContent = '网络异常，请重试';
    console.error('[客服] 自动登录失败', e);
  }
}

async function doLogin() {
  var user = document.getElementById('loginUser').value.trim();
  var pass = document.getElementById('loginPass').value;
  if (!user || !pass) {
    document.getElementById('loginError').textContent = '请输入账号和密码';
    return;
  }
  document.getElementById('loginError').textContent = '登录中...';
  try {
    var res = await fetch(API_BASE + '/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({userName: user, password: pass})
    });
    var data = await res.json();
    if (data.code !== 200) {
      document.getElementById('loginError').textContent = data.msg || '登录失败';
      return;
    }
    saveLoginInfo(data.data);
    hideLogin();
    afterLogin();
  } catch (e) {
    document.getElementById('loginError').textContent = '网络异常，请重试';
    console.error('[客服] 登录失败', e);
  }
}

function saveLoginInfo(d) {
  accessToken = d.accessToken;
  refreshToken = d.refreshToken;
  tokenExpireTime = Date.now() + (d.expireTime || 1800) * 1000;
  myId = d.id || d.userId || d.uid || null;
  myName = d.nickName || d.userName || '客服';
  localStorage.setItem('kefu_agent_token', accessToken);
  localStorage.setItem('kefu_agent_refresh', refreshToken);
  localStorage.setItem('kefu_agent_expire', tokenExpireTime);
  if (myId) localStorage.setItem('kefu_agent_id', myId);
  if (myName) localStorage.setItem('kefu_agent_name', myName);
  document.getElementById('agentName').textContent = myName;
  document.getElementById('agentAvatar').textContent = myName.charAt(0);
}

function afterLogin() {
  document.getElementById('agentName').textContent = myName || '客服';
  document.getElementById('agentAvatar').textContent = (myName || '客').charAt(0);
  loadSessions();
  loadOnlineStatus();
  connectWS();
  startTokenRefresh();
}

/* ==================== Token自动刷新 ==================== */
function startTokenRefresh() {
  if (tokenRefreshTimer) clearInterval(tokenRefreshTimer);
  tokenRefreshTimer = setInterval(function() {
    var remain = tokenExpireTime - Date.now();
    if (remain < 5 * 60 * 1000 && refreshToken) {
      refreshAccessToken();
    }
  }, 60 * 1000);
}

async function refreshAccessToken() {
  if (!refreshToken) return;
  try {
    var res = await fetch(API_BASE + '/refreshToken', {
      method: 'PUT',
      headers: {'refreshToken': refreshToken}
    });
    var data = await res.json();
    if (data.code !== 200) {
      console.warn('[客服] Token刷新失败:', data.msg);
      return;
    }
    accessToken = data.data.accessToken;
    refreshToken = data.data.refreshToken || refreshToken;
    tokenExpireTime = Date.now() + (data.data.expireTime || 1800) * 1000;
    localStorage.setItem('kefu_agent_token', accessToken);
    localStorage.setItem('kefu_agent_refresh', refreshToken);
    localStorage.setItem('kefu_agent_expire', tokenExpireTime);
    console.log('[客服] Token自动刷新成功');
  } catch (e) {
    console.error('[客服] Token刷新异常', e);
  }
}

/* ==================== 会话列表 ==================== */
async function loadSessions() {
  try {
    var res = await fetch(API_BASE + '/friend/list?version=0', {
      headers: {'accessToken': accessToken}
    });
    var data = await res.json();
    if (data.code !== 200 || !data.data) {
      document.getElementById('sessionList').innerHTML = '<div class="empty-sessions">加载会话失败</div>';
      return;
    }
    sessions = data.data.filter(function(f) { return !f.deleted; });
    renderSessions();
  } catch (e) {
    console.error('[客服] 加载会话列表失败', e);
    document.getElementById('sessionList').innerHTML = '<div class="empty-sessions">网络异常</div>';
  }
}

function renderSessions(filter) {
  var list = document.getElementById('sessionList');
  var filtered = filter ? sessions.filter(function(s) {
    return (s.nickName || '').toLowerCase().indexOf(filter.toLowerCase()) >= 0 ||
           (s.remark || '').toLowerCase().indexOf(filter.toLowerCase()) >= 0;
  }) : sessions;
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-sessions">暂无访客会话</div>';
    return;
  }
  // 按最后消息时间排序
  filtered.sort(function(a, b) {
    var ta = lastMsgMap[a.id] ? lastMsgMap[a.id].time : 0;
    var tb = lastMsgMap[b.id] ? lastMsgMap[b.id].time : 0;
    return tb - ta;
  });
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var s = filtered[i];
    var last = lastMsgMap[s.id];
    var unread = unreadMap[s.id] || 0;
    var isOnline = onlineUsers[s.id] && onlineUsers[s.id].length > 0;
    var active = currentVisitorId === s.id ? 'active' : '';
    html += '<div class="session-item ' + active + '" onclick="selectVisitor(' + s.id + ',\'' + escapeHtml(s.nickName || s.userName) + '\')">';
    html += '<div class="session-avatar">' + (s.nickName || s.userName || '访').charAt(0);
    html += '<span class="online-indicator ' + (isOnline ? 'online' : 'offline') + '"></span></div>';
    html += '<div class="session-content">';
    html += '<div class="session-top"><span class="session-nick">' + escapeHtml(s.nickName || s.userName || '访客') + '</span>';
    if (last) html += '<span class="session-time">' + formatTime(last.time) + '</span>';
    html += '</div>';
    html += '<div class="session-preview">' + escapeHtml(last ? last.content : (s.remark || '开始对话')) + '</div>';
    html += '</div>';
    if (unread > 0) html += '<div class="session-unread">' + (unread > 99 ? '99+' : unread) + '</div>';
    html += '</div>';
  }
  list.innerHTML = html;
}

function filterSessions() {
  var kw = document.getElementById('searchInput').value.trim();
  renderSessions(kw || null);
}

/* ==================== 在线状态 ==================== */
async function loadOnlineStatus() {
  try {
    var res = await fetch(API_BASE + '/friend/online', {
      headers: {'accessToken': accessToken}
    });
    var data = await res.json();
    if (data.code === 200 && data.data) {
      onlineUsers = {};
      for (var i = 0; i < data.data.length; i++) {
        var u = data.data[i];
        onlineUsers[u.userId] = u.terminals || [];
      }
      renderSessions(document.getElementById('searchInput').value.trim() || null);
      if (currentVisitorId) updateChatHeader();
    }
  } catch (e) {
    console.error('[客服] 加载在线状态失败', e);
  }
}

/* ==================== 选择访客 ==================== */
function selectVisitor(id, name) {
  currentVisitorId = id;
  currentVisitorName = name;
  unreadMap[id] = 0;
  renderSessions(document.getElementById('searchInput').value.trim() || null);
  document.getElementById('chatHeader').style.display = 'flex';
  document.getElementById('inputArea').style.display = 'block';
  document.getElementById('chatName').textContent = name;
  document.getElementById('chatAvatar').textContent = name.charAt(0);
  updateChatHeader();
  loadHistory(id);
  markAsRead(id);
}

function updateChatHeader() {
  var isOnline = onlineUsers[currentVisitorId] && onlineUsers[currentVisitorId].length > 0;
  document.getElementById('chatStatus').textContent = isOnline ? '在线' : '离线';
  document.getElementById('chatStatus').style.color = isOnline ? 'var(--online)' : 'var(--text-muted)';
}

/* ==================== 历史消息 ==================== */
async function loadHistory(friendId) {
  var msgs = document.getElementById('messages');
  msgs.innerHTML = '<div class="chat-empty"><div class="chat-empty-icon">⏳</div><div class="chat-empty-text">加载消息中...</div></div>';
  try {
    var res = await fetch(API_BASE + '/message/private/history', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'accessToken': accessToken},
      body: JSON.stringify({friendId: friendId, minSeqNo: 0, maxSeqNo: 0})
    });
    var data = await res.json();
    if (data.code !== 200 || !data.data) {
      msgs.innerHTML = '<div class="chat-empty"><div class="chat-empty-icon">💬</div><div class="chat-empty-text">暂无消息记录</div></div>';
      return;
    }
    var list = data.data;
    if (!list.length) {
      msgs.innerHTML = '<div class="chat-empty"><div class="chat-empty-icon">💬</div><div class="chat-empty-text">暂无消息记录，发送第一条消息吧</div></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var m = list[i];
      var isMe = m.sendId === myId;
      html += renderMessage(m, isMe);
    }
    msgs.innerHTML = html;
    scrollToBottom();
  } catch (e) {
    console.error('[客服] 加载历史消息失败', e);
    msgs.innerHTML = '<div class="chat-empty"><div class="chat-empty-icon">⚠️</div><div class="chat-empty-text">加载失败，请重试</div></div>';
  }
}

function renderMessage(m, isMe) {
  var direction = isMe ? 'right' : 'left';
  var avatar = isMe ? (myName || '客').charAt(0) : (currentVisitorName || '访').charAt(0);
  var html = '<div class="msg ' + direction + '">';
  html += '<div class="msg-avatar">' + avatar + '</div>';
  html += '<div><div class="msg-bubble">' + escapeHtml(m.content || '') + '</div>';
  html += '<div class="msg-time">' + formatTime(m.sendTime) + '</div></div>';
  html += '</div>';
  return html;
}

/* ==================== 发送消息 ==================== */
async function sendMessage() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text || !currentVisitorId) return;
  input.value = '';
  // 本地渲染
  appendMessage({sendId: myId, content: text, sendTime: Date.now()}, true);
  lastMsgMap[currentVisitorId] = {content: text, time: Date.now()};
  renderSessions(document.getElementById('searchInput').value.trim() || null);
  try {
    var localId = 'a_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    var res = await fetch(API_BASE + '/message/private/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'accessToken': accessToken},
      body: JSON.stringify({localId: localId, recvId: currentVisitorId, content: text, type: 0})
    });
    var data = await res.json();
    if (data.code !== 200) {
      console.warn('[客服] 消息发送失败:', data.msg);
      appendSystemMsg('发送失败：' + (data.msg || '未知错误'));
    }
  } catch (e) {
    console.error('[客服] 消息发送异常', e);
    appendSystemMsg('网络异常，消息可能未送达');
  }
}

function appendMessage(m, isMe) {
  var msgs = document.getElementById('messages');
  if (msgs.querySelector('.chat-empty')) msgs.innerHTML = '';
  msgs.insertAdjacentHTML('beforeend', renderMessage(m, isMe));
  scrollToBottom();
}

function appendSystemMsg(text) {
  var msgs = document.getElementById('messages');
  msgs.insertAdjacentHTML('beforeend', '<div style="text-align:center;color:var(--text-muted);font-size:12px;margin:8px 0">' + escapeHtml(text) + '</div>');
  scrollToBottom();
}

function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

/* ==================== 消息已读 ==================== */
async function markAsRead(friendId) {
  try {
    await fetch(API_BASE + '/message/private/readed', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json', 'accessToken': accessToken},
      body: JSON.stringify({friendId: friendId})
    });
  } catch (e) { /* 静默 */ }
}

/* ==================== WebSocket ==================== */
function connectWS() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  showConnBar('connecting', '正在连接...');
  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    console.error('[客服] WS创建失败', e);
    scheduleReconnect();
    return;
  }
  ws.onopen = function() {
    wsReconnectCount = 0;
    // 鉴权
    try {
      ws.send(JSON.stringify({cmd: 0, data: {accessToken: accessToken, devId: DEV_ID}}));
    } catch (e) { console.error('[客服] 鉴权包发送失败', e); }
    // 心跳
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(function() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        try { ws.send(JSON.stringify({cmd: 1, data: {}})); } catch (e) {}
      }
    }, 30000);
    showConnBar('online', '已连接');
    setTimeout(function() { hideConnBar(); }, 2000);
    // 拉取离线消息
    loadOfflineMessages();
  };
  ws.onmessage = function(e) {
    try {
      var pkg = JSON.parse(e.data);
      handleWSPacket(pkg);
    } catch (err) {
      console.error('[客服] WS消息解析失败', err, e.data);
    }
  };
  ws.onclose = function() {
    console.warn('[客服] WS断开');
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    showConnBar('offline', '连接已断开，正在重连...');
    scheduleReconnect();
  };
  ws.onerror = function(e) {
    console.error('[客服] WS错误', e);
  };
}

function scheduleReconnect() {
  if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
  wsReconnectCount++;
  var delay = Math.min(1000 * Math.pow(2, wsReconnectCount - 1), 30000);
  wsReconnectTimer = setTimeout(function() { connectWS(); }, delay);
}

function handleWSPacket(pkg) {
  // cmd=3 私聊消息
  if (pkg.cmd === 3 && pkg.data) {
    var body = pkg.data;
    var senderId = body.sendId;
    // 只处理访客发来的消息
    if (senderId === myId) return;
    // 更新最后消息
    lastMsgMap[senderId] = {content: body.content, time: body.sendTime || Date.now()};
    // 如果是当前会话，直接渲染
    if (senderId === currentVisitorId) {
      appendMessage(body, false);
      markAsRead(senderId);
    } else {
      // 未读+1
      unreadMap[senderId] = (unreadMap[senderId] || 0) + 1;
    }
    renderSessions(document.getElementById('searchInput').value.trim() || null);
  }
  // cmd=0 鉴权响应
  else if (pkg.cmd === 0) {
    console.log('[客服] WS鉴权响应', pkg.data);
  }
}

/* ==================== 离线消息 ==================== */
async function loadOfflineMessages() {
  try {
    var res = await fetch(API_BASE + '/message/private/loadOfflineMessage?minId=0', {
      headers: {'accessToken': accessToken}
    });
    var data = await res.json();
    if (data.code !== 200 || !data.data || !Array.isArray(data.data)) return;
    var messages = data.data;
    for (var i = 0; i < messages.length; i++) {
      var msg = messages[i];
      if (msg.sendId === myId) continue;
      lastMsgMap[msg.sendId] = {content: msg.content, time: msg.sendTime};
      if (msg.sendId === currentVisitorId) {
        appendMessage(msg, false);
      } else {
        unreadMap[msg.sendId] = (unreadMap[msg.sendId] || 0) + 1;
      }
    }
    renderSessions(document.getElementById('searchInput').value.trim() || null);
    if (currentVisitorId) markAsRead(currentVisitorId);
  } catch (e) {
    console.error('[客服] 拉取离线消息失败', e);
  }
}

/* ==================== 快捷回复面板 ==================== */
function initReplyPanel() {
  var cats = ['all'];
  for (var i = 0; i < QUICK_REPLIES.length; i++) {
    if (cats.indexOf(QUICK_REPLIES[i].cat) < 0) cats.push(QUICK_REPLIES[i].cat);
  }
  var catHtml = '';
  for (var j = 0; j < cats.length; j++) {
    catHtml += '<span class="reply-cat' + (cats[j] === 'all' ? ' active' : '') + '" onclick="filterReply(\'' + cats[j] + '\')">' + (cats[j] === 'all' ? '全部' : cats[j]) + '</span>';
  }
  document.getElementById('replyCats').innerHTML = catHtml;
  renderReplyList('all');
}

function filterReply(cat) {
  currentCategory = cat;
  var cats = document.querySelectorAll('.reply-cat');
  for (var i = 0; i < cats.length; i++) {
    cats[i].classList.toggle('active', cats[i].textContent === (cat === 'all' ? '全部' : cat));
  }
  renderReplyList(cat);
}

function renderReplyList(cat) {
  var list = document.getElementById('replyList');
  var filtered = cat === 'all' ? QUICK_REPLIES : QUICK_REPLIES.filter(function(r) { return r.cat === cat; });
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var r = filtered[i];
    html += '<div class="reply-item" onclick="insertReply(\'' + r.id + '\')">';
    html += '<div class="reply-id">' + r.id + ' · ' + r.cat + '</div>';
    html += escapeHtml(r.reply.length > 50 ? r.reply.substr(0, 50) + '...' : r.reply);
    html += '</div>';
  }
  list.innerHTML = html;
}

function insertReply(id) {
  var r = QUICK_REPLIES.find(function(x) { return x.id === id; });
  if (!r) return;
  var input = document.getElementById('msgInput');
  input.value = r.reply;
  input.focus();
}

function toggleReplyPanel() {
  document.getElementById('replyPanel').classList.toggle('collapsed');
}

/* ==================== 快捷问题栏 ==================== */
function initQuickBar() {
  var bar = document.getElementById('quickBar');
  var html = '';
  for (var i = 0; i < QUICK_QUESTIONS.length; i++) {
    html += '<span class="quick-tag" onclick="quickSend(\'' + QUICK_QUESTIONS[i] + '\')">' + QUICK_QUESTIONS[i] + '</span>';
  }
  bar.innerHTML = html;
}

function quickSend(text) {
  if (!currentVisitorId) return;
  document.getElementById('msgInput').value = text;
  sendMessage();
}

/* ==================== 工具函数 ==================== */
function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var now = new Date();
  var isToday = d.toDateString() === now.toDateString();
  var h = String(d.getHours()).padStart(2, '0');
  var m = String(d.getMinutes()).padStart(2, '0');
  if (isToday) return h + ':' + m;
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + h + ':' + m;
}

function scrollToBottom() {
  var msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function showConnBar(type, text) {
  var bar = document.getElementById('connBar');
  bar.className = 'conn-bar show ' + type;
  bar.textContent = text;
}

function hideConnBar() {
  document.getElementById('connBar').className = 'conn-bar';
}
